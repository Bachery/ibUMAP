name: ibumap-cuda

channels:
  - rapidsai
  - conda-forge
  - nvidia
  - nodefaults

# RAPIDS Python extensions and the locally built ibumap extensions must load
# libraries from the active Conda environment, not from the base Anaconda
# installation. The Linux dynamic loader expands $ORIGIN to the active
# executable's directory (normally $CONDA_PREFIX/bin for Python and nvcc).
variables:
  LD_LIBRARY_PATH: "$ORIGIN/../lib:$ORIGIN/../targets/x86_64-linux/lib"

dependencies:
  # Python
  - python=3.11.15
  - pip=26.1.2
  - setuptools=83.0.0
  - wheel=0.47.0

  # RAPIDS
  - cuda-version=12.6
  - cuml=26.06.00
  - cuvs=26.06.00
  - pylibcugraph=26.06.00
  - pylibraft=26.06.00
  - rmm=26.06.00
  - cupy=13.6.0

  # Native extension build toolchain
  #
  # CUDA 12.6 supports GCC 13 but not GCC 14. The standalone CCCL headers
  # intentionally precede CUDA 12.6's bundled CCCL 2.5 headers in setup.py;
  # RMM 26.06 requires CCCL >= 3.3 when compiling downstream extensions.
  - cuda-nvcc=12.6.85
  - gxx_linux-64=13.4.0
  - sysroot_linux-64=2.28
  - cccl=3.3.4
  - cython=3.1.8

  # Scientific Python
  - numpy=1.26.4
  - scipy=1.16.3
  - pandas=2.3.3
  - scikit-learn=1.8.0
  - numba=0.61.2

  # UMAP
  - umap-learn=0.5.12
  - pynndescent=0.5.13

  # Downstream case study (HDBSCAN clustering in the BRAQUE application)
  - hdbscan=0.8.44
  - openpyxl=3.1.5    # reads the BRAQUE antibody workbook (.xlsx), stage 02 only

  # IO
  - h5py=3.16.0

  # Utilities
  - matplotlib=3.11.1
  - psutil=7.2.2
  - pyyaml=6.0.3
  - pytest=9.1.1
  - tqdm=4.69.0

  # Pip wheels
  #   pyfftw: conda-forge 0.15.1 has incorrect Python metadata
  #   pyreadr: only needed by scripts/datasets/scdeed/
  - pip:
      - pyfftw==0.15.1
      - pyreadr==0.5.6
